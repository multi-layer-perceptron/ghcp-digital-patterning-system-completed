<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Sample registration stripe pattern</title>
  <desc id="desc">Horizontal and vertical registration stripes used to check alignment, channel ordering, and preview scaling.</desc>
  <rect width="480" height="320" fill="#f1eee7"/>
  <g opacity="0.95">
    <rect x="0" y="0" width="480" height="32" fill="#234d63"/>
    <rect x="0" y="64" width="480" height="32" fill="#b54a35"/>
    <rect x="0" y="128" width="480" height="32" fill="#c59a36"/>
    <rect x="0" y="192" width="480" height="32" fill="#5f7d4c"/>
    <rect x="0" y="256" width="480" height="32" fill="#2f3b46"/>
  </g>
  <g opacity="0.75">
    <rect x="48" y="0" width="18" height="320" fill="#f1eee7"/>
    <rect x="138" y="0" width="18" height="320" fill="#f1eee7"/>
    <rect x="228" y="0" width="18" height="320" fill="#f1eee7"/>
    <rect x="318" y="0" width="18" height="320" fill="#f1eee7"/>
    <rect x="408" y="0" width="18" height="320" fill="#f1eee7"/>
  </g>
  <circle cx="48" cy="48" r="14" fill="#f1eee7" stroke="#2f3b46" stroke-width="4"/>
  <circle cx="432" cy="272" r="14" fill="#f1eee7" stroke="#2f3b46" stroke-width="4"/>
</svg>