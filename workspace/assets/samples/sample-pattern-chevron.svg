<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Sample chevron textile pattern</title>
  <desc id="desc">A repeating chevron pattern using warm neutral, blue, gold, and rust channels.</desc>
  <defs>
    <pattern id="chevron" width="120" height="80" patternUnits="userSpaceOnUse">
      <rect width="120" height="80" fill="#f4efe6"/>
      <path d="M0 16 L30 40 L60 16 L90 40 L120 16 L120 40 L90 64 L60 40 L30 64 L0 40 Z" fill="#1f5f7a"/>
      <path d="M0 0 L30 24 L60 0 L90 24 L120 0 L120 10 L90 34 L60 10 L30 34 L0 10 Z" fill="#c48a2c" opacity="0.85"/>
      <path d="M0 54 L30 78 L60 54 L90 78 L120 54 L120 80 L0 80 Z" fill="#9c3f2e" opacity="0.75"/>
    </pattern>
  </defs>
  <rect width="480" height="320" fill="url(#chevron)"/>
  <rect x="12" y="12" width="456" height="296" fill="none" stroke="#2f3a40" stroke-width="4"/>
</svg>